<!doctype html>
<html>
  <head>
    <title>Kermanych</title>

    <meta charset="utf-8">
    <meta name="description" content="Kermanych v2 web UI">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">

    <script>
      // Before first paint: the stored theme and language (the keys of lib/theme.ts and
      // lib/locale.ts), so the splash below is drawn in the operator's palette and language.
      // boot/tokens.ts re-applies the same theme once the app loads.
      (function () {
        var theme = 'dark';
        var locale = 'uk';
        try {
          var t = localStorage.getItem('kermanych.theme');
          if (t === 'light' || t === 'matrix' || t === 'hermes') theme = t;
          if (localStorage.getItem('kermanych.locale') === 'en') locale = 'en';
        } catch (e) {
          /* storage unavailable: the defaults */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = locale;
      })();
    </script>
    <style>
      /* The start-up splash (docs/specs/2026-10-21-async-feedback.md, decision 10). Before the
         bundle loads it is only the canvas of the last theme (a copy of --k-canvas per theme in
         @kermanych/tokens, since no app CSS has loaded yet); boot/splash.ts then mounts the
         sign-in loader into it (docs/specs/2026-11-15-sign-in-pixel-loader.md). */
      html, #k-splash { background: #050505; }
      html[data-theme='light'], html[data-theme='light'] #k-splash { background: #f6f6f7; }
      html[data-theme='matrix'], html[data-theme='matrix'] #k-splash { background: #070c08; }
      html[data-theme='hermes'], html[data-theme='hermes'] #k-splash { background: #0a0c11; }
      #k-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 200ms ease;
      }
      /* Faded by boot/splash.ts (closeSplash) once the app has mounted, then removed. */
      #k-splash.k-splash--out { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #k-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="k-splash"></div>
    <!-- quasar:entry-point -->
  </body>
</html>
